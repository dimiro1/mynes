"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Each workspace opens its own emulator window and nothing is shared between them.
run_mode = "concurrent"

[scripts.run.emulator]
command = "mvn -q compile exec:exec"
# Swing needs a display, which cloud workspaces do not have.
available_in = [ "local" ]
default = true
icon = "gamepad-2"

# A run script is a button with a fixed command, so this can only ever be a smoke test -- for
# anything else, run the headless mode by hand; see CLAUDE.md. What it is worth is proving the
# emulator works where the button above is greyed out.
[scripts.run.headless]
command = "mvn -q compile exec:exec@headless -Dmynes.args=\"--rom src/test/resources/nestest/nestest.nes --frames 300 --screenshot last --expect-not-blank\""
available_in = [ "local", "cloud" ]
icon = "terminal"
